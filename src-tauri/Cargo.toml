[package]
name = "deepseek-harness-launcher"
version = "0.1.0"
description = "DeepSeek Harness desktop launcher (Tauri)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
strip = true
codegen-units = 1
