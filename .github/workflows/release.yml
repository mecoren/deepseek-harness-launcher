name: Release

# Continuous Delivery for this Tauri 2 app across all supported targets:
#   Windows x64 / arm64, Linux x64 / arm64, macOS x64 / arm64.
# On every `v*` tag push it, per target:
#   1. rebuilds the offline `runtime-host` package (node + dsh + standalone
#      npm updater in tools/npm) for the matching OS/arch so the shipped
#      bundle is fully self-contained / offline,
#   2. builds the platform installer/archive via `tauri-apps/tauri-action`
#      (build-only; no tagName/releaseName, so it never uploads),
#   3. renames the bundles to the canonical
#      {Name}-{Version}-{OS}-{Arch}[-{Variant}].{ext} scheme (postbuild),
#   4. uploads the renamed bundles as workflow artifacts, then a separate
#      `release` job downloads all six platforms' bundles and publishes them
#      in ONE `softprops/action-gh-release` call (which also creates the
#      release). Publishing must happen exactly once, from a single job:
#      action-gh-release wipes a release's existing assets before attaching
#      its files, so letting every matrix job publish in parallel made them
#      delete each other's bundles (v0.1.18/v0.1.19 shipped with no assets).
#      Uploading AFTER the rename is what makes the GitHub asset names match
#      the documented convention (e.g.
#      `DeepSeek Harness Launcher-0.1.15-Windows-Amd64-Installer.exe`).
#
# Secrets needed (repository Settings -> Secrets):
#   GITHUB_TOKEN        provided automatically; needs `contents: write` (set below)
#   APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#                         all four must be set together (or all four left
#                         blank). If any one is missing, the build runs with
#                         **no** APPLE_* env at all — the macOS bundle is only
#                         ad-hoc signed (no notarization), and the build no
#                         longer fails with
#                           `failed to notarize app: Error: Team ID must be at
#                            least 3 characters`
#                         The shipped .app / .dmg will still work, but macOS
#                         users will need to right-click → Open on first launch
#                         (or `xattr -rd com.apple.quarantine ...`).
# No Tauri updater signing key is required — this app updates itself via the
# bundled standalone npm (runtime-host/tools/npm), not Tauri's built-in updater.
#
# Linux build note: the `appimage` target was intentionally removed from
# `src-tauri/tauri.conf.json`'s `bundle.targets`. linuxdeploy's deep ELF
# sweeper could not handle the glibc/musl mix inside
# `runtime-host/node_modules/` (it crashed on `libc.musl-x86_64.so.1` /
# statically-linked landlock-run with a bare `failed to run linuxdeploy`).
# The Linux release ships as `.deb` + `.rpm` only, which covers mainstream
# distributions. Re-enabling appimage requires either trimming
# runtime-host/native modules or shipping a separate AppImage recipe; the
# built-in tauri-appimage path is not viable for this runtime-host.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -C debuginfo=line-tables-only
  # 独立 npm 更新器版本（装入 runtime-host/tools/npm，位于 dsh 依赖图之外）。
  # 与 tools/prepare-runtime-host.ps1 的 $NpmVersion 默认值保持一致；
  # 缺失时 beforeBuildCommand 门禁（tools/verify-runtime-host.mjs）会中止打包。
  RUNTIME_NPM_VERSION: "11.17.0"
  # 打进离线包的 Node 版本（单一事实来源；各平台 pack 步骤引用此变量）。
  # Must be >= v22.16.0: @deepseek-ai/dsh imports node:zlib's zstd API.
  BUNDLED_NODE_VERSION: "v22.22.2"
  # Release must resolve dependencies exactly like CI does (no free float).
  CARGO_NET_LOCKED: "true"

jobs:
  build:
    name: Release ${{ matrix.platform }} (${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # npm-os / npm-cpu drive a SECOND `npm install` pass (after a plain
          # runner-arch install) that re-resolves optional-native-dependency
          # packages such as @koromix/koffi-*, @img/sharp-*, @vscode/ripgrep-*
          # and node-addon-require-builtin-* for the BUNDLED node binary's
          # platform/arch instead of the runner's. A single pass pinned via
          # --os/--cpu is NOT enough: koffi's install script (cnoke.cjs) picks
          # its prebuilt binary by the RUNNING node's arch and then falls back
          # to a cmake source build (which fails on cross-arch runners) when
          # that runner-arch prebuild is missing — hence pass 1 must install
          # for the runner's own arch. The mismatch matters on:
          #   - macos-latest (arm64 hardware) packing the darwin-x64 node
          #   - windows-2022 (x64 hardware) packing the win-arm64 node
          # A mismatched bundle then fails `dsh web` boot with
          # "Cannot find the native Koffi module; did you bundle it correctly?"
          # bundles: tauri CLI validates --bundles values per-host-platform
          # (macOS only accepts `ios,app,dmg`; Linux `deb,rpm,appimage,...`;
          # Windows `nsis,msi`), so each matrix entry pins the types its
          # runner can actually produce. Kept in sync with tauri.conf.json's
          # bundle.targets.
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            node-dist: win-x64
            node-bin: node.exe
            npm-os: win32
            npm-cpu: x64
          - platform: windows-2022
            target: aarch64-pc-windows-msvc
            bundles: nsis,msi
            node-dist: win-arm64
            node-bin: node.exe
            npm-os: win32
            npm-cpu: arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
            node-dist: linux-x64
            node-bin: node
            npm-os: linux
            npm-cpu: x64
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm
            node-dist: linux-arm64
            node-bin: node
            npm-os: linux
            npm-cpu: arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            node-dist: darwin-x64
            node-bin: node
            npm-os: darwin
            npm-cpu: x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            node-dist: darwin-arm64
            node-bin: node
            npm-os: darwin
            npm-cpu: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev libfuse2 gcc-aarch64-linux-gnu

      # The aarch64 Linux target's built-in linker is `aarch64-linux-gnu-gcc`;
      # ensure it resolves on the ARM runner.
      - name: Set ARM64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # `npm ci` (not install): deterministic, lockfile-verified installs — a
      # drifted package-lock.json now fails loudly instead of silently
      # resolving newer transitive deps on release day.
      - name: Install frontend deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> src-tauri/target"
          cache-on-failure: true

      # The offline package (node + @deepseek-ai/dsh + standalone npm updater)
      # is gitignored, so it must be recreated in CI before bundling. Without
      # this step the bundle would ship without the runtime and fall back to
      # `npx` (needs network on first run). Each OS/arch downloads the matching
      # Node 22 binary, copies it into runtime-host, then `npm install`
      # populates node_modules and tools/npm.
      - name: Pack offline runtime-host (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Must be >= v22.16.0: @deepseek-ai/dsh's plugins import
          # `node:zlib`'s zstd API (createZstdDecompress etc.), which only
          # exists from v22.16.0 on. v22.13.0 boots, then dies with a
          # SyntaxError, leaving the app stuck on the loading screen.
          $nodeVer = $env:BUNDLED_NODE_VERSION
          $nodeUrl = "https://nodejs.org/dist/$nodeVer/node-$nodeVer-${{ matrix.node-dist }}.zip"
          Invoke-WebRequest -Uri $nodeUrl -OutFile "$env:RUNNER_TEMP/node.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/node.zip" -DestinationPath "$env:RUNNER_TEMP/node_tmp"
          Copy-Item -Path "$env:RUNNER_TEMP/node_tmp/node-$nodeVer-${{ matrix.node-dist }}/node.exe" `
            -Destination "runtime-host/${{ matrix.node-bin }}" -Force
          # runtime-host/package.json is intentionally NOT tracked in git (the
          # in-app updater rewrites it at runtime); regenerate the minimal
          # manifest npm needs before installing.
          Set-Content -Path runtime-host/package.json -Encoding utf8 -Value @'
          {
            "name": "deepseek-harness-runtime-host",
            "version": "0.0.0",
            "private": true
          }
          '@
          Push-Location runtime-host
          # Two-pass install (see matrix note for why):
          # 1) Plain install for the RUNNER's arch first. koffi's install
          #    script (cnoke.cjs) looks up its prebuilt binary by the running
          #    node's arch and falls back to a cmake source build when that
          #    prebuild is absent, which fails on cross-arch runners.
          npm install --no-audit --no-fund
          # 2) Then re-resolve the optional native deps (koffi/sharp/ripgrep/
          #    ...) for the BUNDLED node's arch. Only leaf binary packages get
          #    swapped, so no install scripts re-run and no source build is
          #    triggered by the swap.
          npm install --no-audit --no-fund --os=${{ matrix.npm-os }} --cpu=${{ matrix.npm-cpu }}
          # 3) Standalone npm updater into tools/npm — outside the dsh
          #    dependency graph so `npm install` updates never rewrite the
          #    updater itself. npm itself is pure JS, so no --os/--cpu pass is
          #    needed. Required by the beforeBuildCommand packaging gate
          #    (tools/verify-runtime-host.mjs); without it the shipped
          #    installer's "check for updates" is guaranteed broken.
          npm install "npm@$env:RUNTIME_NPM_VERSION" --prefix tools/npm --no-audit --no-fund --loglevel=error
          Pop-Location

      - name: Pack offline runtime-host (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          set -euo pipefail
          # Must be >= v22.16.0 for node:zlib's zstd API (see Windows step).
          NODE_VER="${BUNDLED_NODE_VERSION}"
          DIST="node-${NODE_VER}-${{ matrix.node-dist }}"
          curl -fsSL "https://nodejs.org/dist/${NODE_VER}/${DIST}.tar.xz" -o "$RUNNER_TEMP/node.tar.xz"
          mkdir -p "$RUNNER_TEMP/node_tmp"
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP/node_tmp"
          cp "$RUNNER_TEMP/node_tmp/${DIST}/bin/node" "runtime-host/${{ matrix.node-bin }}"
          chmod +x "runtime-host/${{ matrix.node-bin }}"
          # runtime-host/package.json is intentionally NOT tracked in git (the
          # in-app updater rewrites it at runtime); regenerate the minimal
          # manifest npm needs before installing.
          cat > runtime-host/package.json <<'EOF'
          {
            "name": "deepseek-harness-runtime-host",
            "version": "0.0.0",
            "private": true
          }
          EOF
          # Two-pass install: plain first so koffi's cnoke finds the runner-arch
          # prebuilt binary (no cmake source-build fallback), then re-resolve
          # the native platform packages for the bundled node's arch (leaf-only
          # swap, no install scripts re-run).
          (cd runtime-host && npm install --no-audit --no-fund)
          (cd runtime-host && npm install --no-audit --no-fund --os=${{ matrix.npm-os }} --cpu=${{ matrix.npm-cpu }})
          # Standalone npm updater into tools/npm (see Windows step): pure JS,
          # no --os/--cpu pass needed; enforced by the packaging gate.
          (cd runtime-host && npm install "npm@${RUNTIME_NPM_VERSION}" --prefix tools/npm --no-audit --no-fund --loglevel=error)

      - name: Pack offline runtime-host (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          set -euo pipefail
          # Must be >= v22.16.0 for node:zlib's zstd API (see Windows step).
          NODE_VER="${BUNDLED_NODE_VERSION}"
          DIST="node-${NODE_VER}-${{ matrix.node-dist }}"
          curl -fsSL "https://nodejs.org/dist/${NODE_VER}/${DIST}.tar.gz" -o "$RUNNER_TEMP/node.tar.gz"
          mkdir -p "$RUNNER_TEMP/node_tmp"
          tar -xzf "$RUNNER_TEMP/node.tar.gz" -C "$RUNNER_TEMP/node_tmp"
          cp "$RUNNER_TEMP/node_tmp/${DIST}/bin/node" "runtime-host/${{ matrix.node-bin }}"
          chmod +x "runtime-host/${{ matrix.node-bin }}"
          # runtime-host/package.json is intentionally NOT tracked in git (the
          # in-app updater rewrites it at runtime); regenerate the minimal
          # manifest npm needs before installing.
          cat > runtime-host/package.json <<'EOF'
          {
            "name": "deepseek-harness-runtime-host",
            "version": "0.0.0",
            "private": true
          }
          EOF
          # Two-pass install: plain first so koffi's cnoke finds the runner-arch
          # prebuilt binary (no cmake source-build fallback), then re-resolve
          # the native platform packages for the bundled node's arch (leaf-only
          # swap, no install scripts re-run).
          (cd runtime-host && npm install --no-audit --no-fund)
          (cd runtime-host && npm install --no-audit --no-fund --os=${{ matrix.npm-os }} --cpu=${{ matrix.npm-cpu }})
          # Standalone npm updater into tools/npm (see Windows step): pure JS,
          # no --os/--cpu pass needed; enforced by the packaging gate.
          (cd runtime-host && npm install "npm@${RUNTIME_NPM_VERSION}" --prefix tools/npm --no-audit --no-fund --loglevel=error)

      # Gate: the offline runtime must actually boot `dsh web` and print its
      # readiness line before we ship it. Catches node-version / dependency
      # mismatches that compile and bundle fine but leave the installed app
      # stuck on the loading screen forever (e.g. a bundled Node too old for
      # the CLI's node:zlib zstd API).
      #
      # Contract note: this gate mirrors what src-tauri/src/dsh.rs does at
      # runtime — scan BOTH stdout and stderr for a loopback URL anywhere in a
      # line (the CLI may print vite-style banners or log to either stream).
      # Keep this pattern in sync with `parse_readiness_line`.
      - name: Smoke test offline runtime-host
        # The aarch64-pc-windows-msvc job bundles the win-arm64 node.exe, which
        # cannot execute on the x64 windows-2022 runner (x64 Windows has no
        # ARM64 emulation), so the boot gate cannot run there — that job runs
        # the static packaging check in the next step instead.
        if: matrix.target != 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP "dsh-smoke-${{ matrix.target }}"
          $out = Join-Path $env:RUNNER_TEMP "dsh-smoke-out.log"
          $err = Join-Path $env:RUNNER_TEMP "dsh-smoke-err.log"
          $bin = Join-Path (Resolve-Path "runtime-host").Path "${{ matrix.node-bin }}"
          $cli = "node_modules/@deepseek-ai/dsh/lib/bin.js"
          $startArgs = @{
            FilePath               = $bin
            ArgumentList           = @($cli, "web", "--host", "127.0.0.1", "--port", "0")
            WorkingDirectory       = (Resolve-Path "runtime-host").Path
            RedirectStandardOutput = $out
            RedirectStandardError  = $err
            PassThru               = $true
          }
          # `-WindowStyle` is Windows-only; PowerShell on macOS/Linux rejects
          # the parameter outright, so pass it only on Windows runners.
          if ($IsWindows) { $startArgs.WindowStyle = "Hidden" }
          $p = Start-Process @startArgs
          $deadline = (Get-Date).AddSeconds(150)
          # Same contract as parse_readiness_line in dsh.rs: the loopback URL
          # may appear on EITHER stream and inside any banner format.
          $pattern = 'http://(127\.0\.0\.1|localhost):\d{1,5}'
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            foreach ($f in @($out, $err)) {
              if (Test-Path $f) {
                $text = Get-Content $f -Raw -ErrorAction SilentlyContinue
                if ($text -match $pattern) { $ok = $true; break }
              }
            }
            if ($ok) { break }
            if ($p.HasExited) { break }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) {
            if (Test-Path $err) { Get-Content $err -Tail 60 }
            if (-not $p.HasExited) {
              if ($IsWindows) { taskkill /PID $p.Id /T /F 2>$null | Out-Null }
              else { kill -9 $p.Id 2>$null }
            }
            throw "dsh web smoke test failed: no readiness line within 150s"
          }
          if ($IsWindows) { taskkill /PID $p.Id /T /F 2>$null | Out-Null }
          else { kill -9 $p.Id 2>$null }
          "dsh web smoke test passed"

      # aarch64 Windows cannot run its own boot gate (win-arm64 node.exe is not
      # executable on the x64 windows-2022 runner), so verify the bundle
      # statically instead: the arch-matched native binaries that the pack step
      # installed for the bundled arm64 node must all be present. Covers the
      # same koffi/sharp/ripgrep/HMR-probe classes the boot gate catches on the
      # other five matrix entries.
      - name: Verify offline runtime-host packaging (aarch64 Windows)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Resolve-Path "runtime-host").Path
          $need = @(
            "node_modules/@koromix/koffi-win32-arm64",
            "node_modules/@img/sharp-win32-arm64",
            "node_modules/@vscode/ripgrep-win32-arm64",
            "node_modules/node-addon-require-builtin-win32-arm64-msvc"
          )
          foreach ($rel in $need) {
            if (-not (Test-Path (Join-Path $root $rel))) {
              throw "missing $rel in offline runtime-host bundle"
            }
          }
          "offline runtime-host packaging OK (aarch64 Windows)"
      # Detect whether all four Apple signing/notarization secrets are present.
      #
      # IMPORTANT: tauri-cli treats a *set-but-empty* APPLE_* env var exactly
      # like a real value — e.g. an empty APPLE_SIGNING_IDENTITY makes it sign
      # with identity "" → codesign "no identity found"; empty APPLE_ID /
      # APPLE_TEAM_ID send it down the notarize path → "Team ID must be at
      # least 3 characters". So we never pass blank vars: the two build steps
      # below either set all four env vars or none of them.
      - name: Detect Apple signing credentials
        id: apple-creds
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          if [ -n "${{ secrets.APPLE_SIGNING_IDENTITY }}" ] \
             && [ -n "${{ secrets.APPLE_ID }}" ] \
             && [ -n "${{ secrets.APPLE_PASSWORD }}" ] \
             && [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "has_creds=true"  >> "$GITHUB_OUTPUT"
            echo "::notice::All Apple signing secrets are configured — macOS bundle will be signed + notarized."
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::At least one Apple signing secret is missing — macOS bundle will be ad-hoc signed only (no notarization). Downstream users will need to right-click → Open the .app on first launch, or run `xattr -rd com.apple.quarantine /path/to/DeepSeek Harness.app`."
          fi

      # Sync the package.json version into tauri.conf.json BEFORE building so
      # the emitted bundles carry the correct version. (PowerShell 5.1 on the
      # Windows runner only supports two-arg Join-Path; the script is written
      # to be compatible.)
      - name: Sync version into tauri.conf.json
        run: npm run prebuild

      # macOS + all Apple secrets present: full signing + notarization.
      #
      # NOTE: we invoke `tauri build` directly via `npx tauri` rather than the
      # `tauri-apps/tauri-action@v0` wrapper. The v0 wrapper was observed to
      # exit 0 with an empty `bundle/` directory across all six matrix jobs
      # (v0.1.20 run: every `Build release bundles` step reported success but
      # produced no installers, leaving the release with no assets). Calling
      # tauri CLI directly makes the exit code authoritative — any bundle
      # failure now fails the matrix job instead of being silently swallowed
      # by the wrapper's `retry()` helper. `--bundles ${{ matrix.bundles }}`
      # pins the types each runner can emit (see the matrix note).
      #
      # Working directory is `src-tauri` (matches what tauri-action does by
      # default). The build step is `Build-only` — release publication is
      # handled by the dedicated `release` job below.
      #
      # `shell: bash` is REQUIRED here: the run block uses bashisms
      # (`set -euxo pipefail`, `tee`, `ls -laR`). On Windows runners the
      # default shell is PowerShell, where `set` is `Set-Variable` and the
      # step dies instantly with "A parameter cannot be found that matches
      # parameter name 'euxo'".
      - name: Build release bundles (signed + notarized)
        if: steps.apple-creds.outputs.has_creds == 'true'
        working-directory: src-tauri
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euxo pipefail
          npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --verbose 2>&1 | tee build.log
          echo "--- bundle contents after build ---"
          ls -laR src-tauri/target/${{ matrix.target }}/release/bundle/ 2>&1 || true

      # Every other platform (Windows/Linux) and macOS without Apple secrets:
      # no APPLE_* env at all, so tauri-cli falls back to the config identity
      # (tauri.conf.json signingIdentity "-" → ad-hoc) and skips notarization.
      # Same rationale as the signed step above for using `npx tauri` directly.
      - name: Build release bundles
        if: steps.apple-creds.outputs.has_creds != 'true'
        working-directory: src-tauri
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --verbose 2>&1 | tee build.log
          echo "--- bundle contents after build ---"
          ls -laR src-tauri/target/${{ matrix.target }}/release/bundle/ 2>&1 || true

      # Rename the freshly built bundles into the canonical
      # {Name}-{Version}-{OS}-{Arch}[-{Variant}].{ext} scheme AFTER the build so
      # the GitHub Release assets match the documented naming convention, e.g.
      #   DeepSeek Harness Launcher-0.1.15-Windows-Amd64-Installer.exe
      - name: Rename bundles to canonical asset names
        if: success()
        run: npm run postbuild

      # Diagnostic: print exactly what the build produced so a future
      # "missing bundle" regression is obvious from the run log. Always runs
      # (even on failure) so the output is visible when things go wrong.
      - name: Inspect bundle output
        if: always()
        shell: bash
        run: |
          echo "=== bundle directories ==="
          find src-tauri/target -type d -name bundle 2>&1 || true
          echo ""
          echo "=== bundle files ==="
          find src-tauri/target -path '*/release/bundle/*' -type f 2>&1 || true
          echo ""
          echo "=== tauri.conf.json bundle.targets ==="
          node -e "console.log(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).bundle.targets)"

      # Upload AFTER renaming — tauri-action uploads the raw `tauri build`
      # output before postbuild can rename it, which is why past releases kept
      # Tauri's default asset names. Upload the renamed bundles as workflow
      # artifacts; the `release` job below downloads all six platforms' bundles
      # and publishes them in ONE action-gh-release call.
      #
      # `if-no-files-found: error` (NOT warn) is critical: v0.1.18 → v0.1.23
      # all shipped with empty releases because this step silently warned
      # when its globs matched nothing. The whole workflow then "succeeded"
      # with zero assets and nobody noticed. With `error` here, the matrix job
      # FAILS the moment no artifacts are found — a red build instead of a
      # quietly broken release.
      #
      # The `**/` is the real fix: Tauri 2 writes bundles under
      # `bundle/<format>/` SUBDIRECTORIES (bundle/msi/, bundle/nsis/,
      # bundle/deb/, bundle/rpm/, bundle/dmg/, bundle/macos/), not directly
      # in bundle/. The old `bundle/*.msi` globs only matched the direct
      # level, so they could NEVER match the actual products even though
      # `tauri build` had succeeded — that mismatch silently dropped every
      # release asset since v0.1.18.
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.tar.gz
            src-tauri/target/**/release/bundle/**/*.app.zip

  # Publish in a single, dedicated job. Every matrix job used to call
  # action-gh-release in parallel, and each call wipes the release's existing
  # assets before attaching its own files — so the six jobs kept deleting each
  # other's bundles and the release shipped with zero artifacts (v0.1.18 /
  # v0.1.19). Running after `build` finishes lets this one job collect ALL
  # platforms' renamed bundles and upload them together.
  release:
    name: Publish release assets
    needs: build
    # Runs even when some matrix builds failed, so the platforms that DID
    # succeed still get published (same resilience as the old per-job flow) —
    # but a partial matrix now announces itself loudly instead of shipping
    # silently incomplete (the v0.1.18-v0.1.23 class of incident).
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Announce matrix outcome
        shell: bash
        run: |
          res="${{ needs.build.result }}"
          if [ "$res" != "success" ]; then
            echo "::warning::Release build matrix result was '$res' — this release may be missing platform assets. Check the build jobs before announcing."
          else
            echo "All platform builds succeeded."
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "DeepSeek Harness Launcher ${{ github.ref_name }}"
          body: "See the assets below for your platform."
          draft: false
          prerelease: false
          files: release-assets/**
          fail_on_unmatched_files: true
