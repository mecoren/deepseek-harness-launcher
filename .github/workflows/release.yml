name: Release

# Continuous Delivery for this Tauri 2 app across all supported targets:
#   Windows x64 / arm64, Linux x64 / arm64, macOS x64 / arm64.
# On every `v*` tag push it, per target:
#   1. rebuilds the offline `runtime-host` package (node + dsh + pnpm) for the
#      matching OS/arch so the shipped bundle is fully self-contained / offline,
#   2. builds the platform installer/archive via `tauri-apps/tauri-action`,
#   3. uploads the artifacts to the GitHub release for the tag.
#
# Secrets needed (repository Settings -> Secrets):
#   GITHUB_TOKEN        provided automatically; needs `contents: write` (set below)
#   APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#                         all four must be set together (or all four left
#                         blank). If any one is missing, the build runs with
#                         **no** APPLE_* env at all — the macOS bundle is only
#                         ad-hoc signed (no notarization), and the build no
#                         longer fails with
#                           `failed to notarize app: Error: Team ID must be at
#                            least 3 characters`
#                         The shipped .app / .dmg will still work, but macOS
#                         users will need to right-click → Open on first launch
#                         (or `xattr -rd com.apple.quarantine ...`).
# No Tauri updater signing key is required — this app updates itself via the
# bundled pnpm, not Tauri's built-in updater.
#
# Linux build note: the `appimage` target was intentionally removed from
# `src-tauri/tauri.conf.json`'s `bundle.targets`. linuxdeploy's deep ELF
# sweeper could not handle the glibc/musl mix inside
# `runtime-host/node_modules/` (it crashed on `libc.musl-x86_64.so.1` /
# statically-linked landlock-run with a bare `failed to run linuxdeploy`).
# The Linux release ships as `.deb` + `.rpm` only, which covers mainstream
# distributions. Re-enabling appimage requires either trimming
# runtime-host/native modules or shipping a separate AppImage recipe; the
# built-in tauri-appimage path is not viable for this runtime-host.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -C debuginfo=line-tables-only

jobs:
  build:
    name: Release ${{ matrix.platform }} (${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
            node-dist: win-x64
            node-bin: node.exe
          - platform: windows-2022
            target: aarch64-pc-windows-msvc
            node-dist: win-arm64
            node-bin: node.exe
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            node-dist: linux-x64
            node-bin: node
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            node-dist: linux-arm64
            node-bin: node
          - platform: macos-latest
            target: x86_64-apple-darwin
            node-dist: darwin-x64
            node-bin: node
          - platform: macos-latest
            target: aarch64-apple-darwin
            node-dist: darwin-arm64
            node-bin: node
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev libfuse2 gcc-aarch64-linux-gnu

      # The aarch64 Linux target's built-in linker is `aarch64-linux-gnu-gcc`;
      # ensure it resolves on the ARM runner.
      - name: Set ARM64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      # Installs the frontend (Tauri app) deps; `tauri-action` runs the
      # configured `beforeBuildCommand` (npm run build) to produce the web UI.
      - name: Install frontend deps
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> src-tauri/target"
          cache-on-failure: true

      # The offline package (node + @deepseek-ai/dsh + pnpm) is gitignored, so
      # it must be recreated in CI before bundling. Without this step the bundle
      # would ship without the runtime and fall back to `npx` (needs network on
      # first run). Each OS/arch downloads the matching Node 22 binary, copies
      # it into runtime-host, then `npm install` populates node_modules.
      - name: Pack offline runtime-host (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Must be >= v22.16.0: @deepseek-ai/dsh's plugins import
          # `node:zlib`'s zstd API (createZstdDecompress etc.), which only
          # exists from v22.16.0 on. v22.13.0 boots, then dies with a
          # SyntaxError, leaving the app stuck on the loading screen.
          $nodeVer = "v22.22.2"
          $nodeUrl = "https://nodejs.org/dist/$nodeVer/node-$nodeVer-${{ matrix.node-dist }}.zip"
          Invoke-WebRequest -Uri $nodeUrl -OutFile "$env:RUNNER_TEMP/node.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/node.zip" -DestinationPath "$env:RUNNER_TEMP/node_tmp"
          Copy-Item -Path "$env:RUNNER_TEMP/node_tmp/node-$nodeVer-${{ matrix.node-dist }}/node.exe" `
            -Destination "runtime-host/${{ matrix.node-bin }}" -Force
          Push-Location runtime-host
          npm install --no-audit --no-fund
          Pop-Location

      - name: Pack offline runtime-host (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          set -euo pipefail
          # Must be >= v22.16.0 for node:zlib's zstd API (see Windows step).
          NODE_VER=v22.22.2
          DIST="node-${NODE_VER}-${{ matrix.node-dist }}"
          curl -fsSL "https://nodejs.org/dist/${NODE_VER}/${DIST}.tar.xz" -o "$RUNNER_TEMP/node.tar.xz"
          mkdir -p "$RUNNER_TEMP/node_tmp"
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP/node_tmp"
          cp "$RUNNER_TEMP/node_tmp/${DIST}/bin/node" "runtime-host/${{ matrix.node-bin }}"
          chmod +x "runtime-host/${{ matrix.node-bin }}"
          (cd runtime-host && npm install --no-audit --no-fund)

      - name: Pack offline runtime-host (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          set -euo pipefail
          # Must be >= v22.16.0 for node:zlib's zstd API (see Windows step).
          NODE_VER=v22.22.2
          DIST="node-${NODE_VER}-${{ matrix.node-dist }}"
          curl -fsSL "https://nodejs.org/dist/${NODE_VER}/${DIST}.tar.gz" -o "$RUNNER_TEMP/node.tar.gz"
          mkdir -p "$RUNNER_TEMP/node_tmp"
          tar -xzf "$RUNNER_TEMP/node.tar.gz" -C "$RUNNER_TEMP/node_tmp"
          cp "$RUNNER_TEMP/node_tmp/${DIST}/bin/node" "runtime-host/${{ matrix.node-bin }}"
          chmod +x "runtime-host/${{ matrix.node-bin }}"
          (cd runtime-host && npm install --no-audit --no-fund)

          # Gate: the offline runtime must actually boot `dsh web` and print its
      # readiness line before we ship it. Catches node-version / dependency
      # mismatches that compile and bundle fine but leave the installed app
      # stuck on the loading screen forever (e.g. a bundled Node too old for
      # the CLI's node:zlib zstd API).
      - name: Smoke test offline runtime-host
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP "dsh-smoke-${{ matrix.target }}"
          $out = Join-Path $env:RUNNER_TEMP "dsh-smoke-out.log"
          $err = Join-Path $env:RUNNER_TEMP "dsh-smoke-err.log"
          $bin = Join-Path (Resolve-Path "runtime-host").Path "${{ matrix.node-bin }}"
          $cli = "node_modules/@deepseek-ai/dsh/lib/bin.js"
          $p = Start-Process -FilePath $bin -ArgumentList @($cli, "web", "--host", "127.0.0.1", "--port", "0") `
            -WorkingDirectory (Resolve-Path "runtime-host").Path `
            -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -WindowStyle Hidden
          $deadline = (Get-Date).AddSeconds(150)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $out) {
              $text = Get-Content $out -Raw -ErrorAction SilentlyContinue
              if ($text -match 'dsh web: http://127\.0\.0\.1:\d+') { $ok = $true; break }
            }
            if ($p.HasExited) { break }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) {
            if (Test-Path $err) { Get-Content $err -Tail 60 }
            if (-not $p.HasExited) {
              if ($IsWindows) { taskkill /PID $p.Id /T /F 2>$null | Out-Null }
              else { kill -9 $p.Id 2>$null }
            }
            throw "dsh web smoke test failed: no readiness line within 150s"
          }
          if ($IsWindows) { taskkill /PID $p.Id /T /F 2>$null | Out-Null }
          else { kill -9 $p.Id 2>$null }
          "dsh web smoke test passed"
      # Detect whether all four Apple signing/notarization secrets are present.
      #
      # IMPORTANT: tauri-cli treats a *set-but-empty* APPLE_* env var exactly
      # like a real value — e.g. an empty APPLE_SIGNING_IDENTITY makes it sign
      # with identity "" → codesign "no identity found"; empty APPLE_ID /
      # APPLE_TEAM_ID send it down the notarize path → "Team ID must be at
      # least 3 characters". So we never pass blank vars: the two build steps
      # below either set all four env vars or none of them.
      - name: Detect Apple signing credentials
        id: apple-creds
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          if [ -n "${{ secrets.APPLE_SIGNING_IDENTITY }}" ] \
             && [ -n "${{ secrets.APPLE_ID }}" ] \
             && [ -n "${{ secrets.APPLE_PASSWORD }}" ] \
             && [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "has_creds=true"  >> "$GITHUB_OUTPUT"
            echo "::notice::All Apple signing secrets are configured — macOS bundle will be signed + notarized."
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::At least one Apple signing secret is missing — macOS bundle will be ad-hoc signed only (no notarization). Downstream users will need to right-click → Open the .app on first launch, or run `xattr -rd com.apple.quarantine /path/to/DeepSeek Harness.app`."
          fi

      # macOS + all Apple secrets present: full signing + notarization.
      - name: Build & publish release (signed + notarized)
        if: steps.apple-creds.outputs.has_creds == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DeepSeek_Harness_Launcher ${{ github.ref_name }}"
          releaseBody: "See the assets below for your platform."
          # Draft by default so you can review the artifacts before publishing.
          # Set to false for fully automatic (continuous) delivery.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # Every other platform (Windows/Linux) and macOS without Apple secrets:
      # no APPLE_* env at all, so tauri-cli falls back to the config identity
      # (tauri.conf.json signingIdentity "-" → ad-hoc) and skips notarization.
      - name: Build & publish release
        if: steps.apple-creds.outputs.has_creds != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DeepSeek_Harness_Launcher ${{ github.ref_name }}"
          releaseBody: "See the assets below for your platform."
          # Draft by default so you can review the artifacts before publishing.
          # Set to false for fully automatic (continuous) delivery.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
